<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gameweek Lab — Team Template 4-5-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E14;
    --panel:#11151F;
    --grid:#1E2430;
    --lime:#7CFF6B;
    --purple:#6C4FE0;
    --text:#F5F5F5;
    --muted:#8A93A6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;background:var(--bg);}
  body{
    font-family:'Inter','DejaVu Sans',sans-serif;
    color:var(--text);
    position:relative;
    overflow:hidden;
  }
  /* subtle 26px lab grid across the whole canvas */
  .gridbg{
    position:absolute;inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
    opacity:.28;
  }
  .canvas{position:absolute;inset:0;padding:44px 48px 36px;display:flex;flex-direction:column;}

  /* ── Brand row ─────────────────────────── */
  .brandrow{display:flex;justify-content:space-between;align-items:baseline;}
  .wordmark{
    font-family:'Archivo Black','DejaVu Sans Condensed','DejaVu Sans',sans-serif;
    font-weight:800;font-size:30px;letter-spacing:1.5px;
  }
  .wordmark .dot{color:var(--lime);}
  .gwtag{
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:26px;letter-spacing:2px;color:var(--muted);
  }
  /* ── Category badge ────────────────────── */
  .badgerow{margin-top:22px;display:flex;align-items:center;gap:14px;}
  .badge{
    background:var(--lime);color:#0B0E14;
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:24px;letter-spacing:2.5px;
    padding:7px 20px 8px;border-radius:999px;
  }
  .formation{
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:24px;letter-spacing:2.5px;color:var(--muted);
    border:1px solid var(--grid);border-radius:999px;padding:6px 18px 7px;
  }
  /* headline slot: intentionally empty — add as a text object in Tableau */
  .headline-slot{height:100px;}

  /* ── Pitch ─────────────────────────────── */
  .pitch{
    position:relative;flex:1;
    border:1px solid var(--grid);border-radius:18px;
    background:linear-gradient(180deg, rgba(17,21,31,.55), rgba(17,21,31,.25));
    padding:34px 30px 26px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .pitch svg.markings{position:absolute;inset:0;width:100%;height:100%;border-radius:18px;}

  .row{position:relative;display:flex;justify-content:center;gap:18px;}
  .rowlabel{
    position:absolute;left:-6px;top:50%;transform:translateY(-50%) rotate(180deg);
    writing-mode:vertical-rl;
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:17px;letter-spacing:3px;color:var(--muted);opacity:.75;
  }
  /* ── Player slot cards ─────────────────── */
  .slot{
    width:168px;height:150px;
    background:var(--panel);
    border:1px solid var(--grid);
    border-radius:14px;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .slot .photo{flex:1;}                       /* drop player image / mark here in Tableau */
  .slot .namebar{
    height:34px;background:rgba(30,36,48,.65);
    border-top:1px solid var(--grid);
  }                                            /* player name text object goes here */
  .slot .databar{
    height:30px;display:flex;
    border-top:1px solid var(--grid);
  }                                            /* price | pts — two text objects */
  .slot .databar .cell{flex:1;}
  .slot .databar .cell + .cell{border-left:1px solid var(--grid);}

  /* ── Bench ─────────────────────────────── */
  .bench{margin-top:20px;}
  .benchhead{
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:19px;letter-spacing:3px;color:var(--muted);
    margin-bottom:10px;
  }
  .benchrow{display:flex;gap:18px;}
  .bslot{
    flex:1;height:64px;background:var(--panel);
    border:1px solid var(--grid);border-radius:12px;
    display:flex;overflow:hidden;
  }
  .bslot .bphoto{width:64px;border-right:1px solid var(--grid);}
  .bslot .binfo{flex:1;}

  /* ── Footer ────────────────────────────── */
  .footer{
    margin-top:22px;display:flex;justify-content:space-between;align-items:center;
    font-size:15px;color:var(--muted);
  }
  .footer .num{
    font-family:'Barlow Condensed','DejaVu Sans Condensed',sans-serif;
    font-weight:700;font-size:18px;letter-spacing:2px;
  }
  .footer .num span{color:var(--lime);}
</style>
</head>
<body>
  <div class="gridbg"></div>
  <div class="canvas">

    <div class="brandrow">
      <div class="wordmark">THE GAMEWEEK LAB<span class="dot">_</span></div>
      <div class="gwtag">GW— · PRE</div>
    </div>

    <div class="badgerow">
      <div class="badge">TEAM REVEAL</div>
      <div class="formation">4-5-1</div>
    </div>

    <div class="headline-slot"></div>

    <div class="pitch">
      <svg class="markings" viewBox="0 0 954 780" preserveAspectRatio="none" fill="none">
        <!-- halfway line + centre circle -->
        <line x1="0" y1="390" x2="954" y2="390" stroke="#1E2430" stroke-width="1.5"/>
        <circle cx="477" cy="390" r="88" stroke="#1E2430" stroke-width="1.5"/>
        <circle cx="477" cy="390" r="4" fill="#1E2430"/>
        <!-- top penalty box (GK end) -->
        <rect x="257" y="0" width="440" height="118" stroke="#1E2430" stroke-width="1.5"/>
        <rect x="367" y="0" width="220" height="48" stroke="#1E2430" stroke-width="1.5"/>
        <!-- bottom penalty box -->
        <rect x="257" y="662" width="440" height="118" stroke="#1E2430" stroke-width="1.5"/>
        <rect x="367" y="732" width="220" height="48" stroke="#1E2430" stroke-width="1.5"/>
      </svg>

      <div class="row">
        <div class="rowlabel">GK</div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
      </div>

      <div class="row">
        <div class="rowlabel">DEF</div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
      </div>

      <div class="row">
        <div class="rowlabel">MID</div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
      </div>

      <div class="row">
        <div class="rowlabel">FWD</div>
        <div class="slot"><div class="photo"></div><div class="namebar"></div><div class="databar"><div class="cell"></div><div class="cell"></div></div></div>
      </div>
    </div>

    <div class="bench">
      <div class="benchhead">BENCH</div>
      <div class="benchrow">
        <div class="bslot"><div class="bphoto"></div><div class="binfo"></div></div>
        <div class="bslot"><div class="bphoto"></div><div class="binfo"></div></div>
        <div class="bslot"><div class="bphoto"></div><div class="binfo"></div></div>
        <div class="bslot"><div class="bphoto"></div><div class="binfo"></div></div>
      </div>
    </div>

    <div class="footer">
      <div>Data: Official FPL API · 2026/27</div>
      <div class="num"><span>—</span> / —</div>
    </div>

  </div>
</body>
</html>
