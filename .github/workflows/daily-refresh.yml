name: Daily Data Refresh

on:
  schedule:
    # Cada 3 horas. No es por los datos (con una vez al día alcanzaría),
    # sino por la ventana de decisión de transferencias: evolve_base_squad
    # solo decide en las últimas 3h antes del deadline, y los deadlines de
    # FPL caen a horas muy distintas (vie 17:30, sáb 10:00, sáb 12:30...).
    # Corriendo cada 3h siempre cae al menos una ejecución dentro de la
    # ventana, sin importar el horario del deadline.
    - cron: "0 */3 * * *"
  workflow_dispatch: # permite dispararlo a mano desde la pestaña Actions de GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos frescos de la API de FPL
        run: python scripts/run_fetch.py

      - name: Calcular xP, exportar CSVs para Tableau y generar el briefing
        run: python scripts/export_for_tableau.py

      # Los dos pasos siguientes son complementarios: si fallan, los datos
      # principales (CSVs para Tableau, briefing, equipo Base) igual se
      # publican. Antes, un error acá dejaba todo el pipeline sin
      # actualizar — el commit es el último paso y no se alcanzaba.
      - name: Vista especulativa del equipo a 4 fechas (no toca my_team.csv)
        run: python scripts/run_trajectory_preview.py
        continue-on-error: true

      - name: Grabar predicción de la fecha + completar puntos reales de fechas ya jugadas
        run: python scripts/run_calibration.py
        continue-on-error: true

      - name: Commitear y subir los CSVs actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed my_team.csv
          git diff --cached --quiet || git commit -m "Actualización automática de datos - $(date -u +'%Y-%m-%d')"
          git push
